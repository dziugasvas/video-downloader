<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Downloader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c8cff'/><path d='M16 8v12m-5-5 5 5 5-5M10 24h12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body data-api="api">
  <main class="vd">
    <header class="vd-header">
      <div class="vd-brand">
        <span class="vd-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M6 19.5h12"/></svg>
        </span>
        <h1>Video Downloader</h1>
      </div>
      <div id="vd-warnings" class="vd-warnings"></div>
    </header>

    <section class="vd-card vd-new">
      <textarea id="vd-links" rows="3" spellcheck="false"
        placeholder="Paste YouTube links, one per line. Playlist links download the whole playlist."></textarea>

      <div class="vd-row">
        <div class="vd-seg" id="vd-quality" role="radiogroup" aria-label="Quality">
          <button type="button" role="radio" data-q="720">720p</button>
          <button type="button" role="radio" data-q="1080">1080p</button>
          <button type="button" role="radio" data-q="best">Best</button>
          <button type="button" role="radio" data-q="audio">Audio only</button>
        </div>
        <button id="vd-download" class="vd-btn vd-primary" type="button">
          Download <kbd>⌘↵</kbd>
        </button>
      </div>
      <p id="vd-quality-hint" class="vd-hint"></p>

      <div class="vd-folder">
        <svg class="vd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
        <input id="vd-folder" type="text" spellcheck="false" aria-label="Save to folder">
        <button id="vd-choose" class="vd-btn vd-ghost" type="button">Change…</button>
        <button id="vd-open" class="vd-btn vd-ghost" type="button">Open</button>
      </div>
    </section>

    <section class="vd-section">
      <div class="vd-section-head">
        <h2>Downloads</h2>
        <button id="vd-clear-jobs" class="vd-link" type="button" hidden>Clear finished</button>
      </div>
      <ul id="vd-jobs" class="vd-list"></ul>
      <p id="vd-jobs-empty" class="vd-empty">Nothing downloading. Paste a link above to start.</p>
    </section>

    <section class="vd-section">
      <div class="vd-section-head">
        <h2>Finished</h2>
        <button id="vd-clear-history" class="vd-link" type="button" hidden>Clear</button>
      </div>
      <ul id="vd-history" class="vd-list vd-history"></ul>
      <p id="vd-history-empty" class="vd-empty">Finished files will show up here until you quit the app.</p>
    </section>

    <footer class="vd-footer">
      <span id="vd-version">yt-dlp …</span>
      <button id="vd-update" class="vd-link" type="button">Update yt-dlp</button>
    </footer>
  </main>

  <div id="vd-toast" class="vd-toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
